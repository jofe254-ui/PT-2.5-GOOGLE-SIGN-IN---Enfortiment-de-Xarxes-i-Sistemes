<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PT 2.5 - Google Sign-In</title>
  <meta name="google-signin-client_id" content="167378223681-fja42193semuokpunhk6u8tbapmc0kne.apps.googleusercontent.com">
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background:
        radial-gradient(circle at 18% 22%, rgba(16, 185, 129, 0.28), transparent 42%),
        radial-gradient(circle at 82% 78%, rgba(6, 182, 212, 0.32), transparent 45%),
        radial-gradient(circle at 50% 50%, #053836 0%, #032224 55%, #011316 100%);
      color: #ecfdf5;
      padding: 1.5rem;
      overflow: hidden;
      position: relative;
    }

    /* Aurores lluminoses en verd maragda i blau turquesa */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(95px);
      z-index: 0;
      pointer-events: none;
      animation: flotar 9s ease-in-out infinite alternate;
    }

    body::before {
      background: linear-gradient(135deg, #10b981, #14b8a6);
      top: -110px;
      left: -90px;
      opacity: 0.45;
    }

    body::after {
      background: linear-gradient(135deg, #06b6d4, #2dd4bf);
      bottom: -120px;
      right: -90px;
      opacity: 0.45;
      animation-delay: -4.5s;
    }

    @keyframes flotar {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(35px, 25px) scale(1.12); }
    }

    .targeta {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 460px;
      background: linear-gradient(160deg, rgba(6, 55, 53, 0.78), rgba(4, 34, 40, 0.85));
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(45, 212, 191, 0.38);
      border-radius: 24px;
      padding: 3rem 2.25rem;
      text-align: center;
      box-shadow:
        0 25px 60px -15px rgba(0, 0, 0, 0.75),
        0 0 40px -10px rgba(20, 184, 166, 0.35),
        inset 0 1px 0 rgba(167, 243, 208, 0.25);
      overflow: hidden;
    }

    /* Franja superior lluminosa turquesa-maragda */
    .targeta::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: linear-gradient(90deg, #10b981, #2dd4bf, #22d3ee, #34d399);
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      letter-spacing: 0.05em;
      background: linear-gradient(95deg, #6ee7b7 0%, #2dd4bf 45%, #22d3ee 80%, #a7f3d0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 12px rgba(45, 212, 191, 0.3));
      margin-bottom: 1.85rem;
      position: relative;
      padding-bottom: 1rem;
    }

    h1::after {
      content: "";
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 90px;
      height: 3px;
      border-radius: 999px;
      background: linear-gradient(90deg, #10b981, #22d3ee);
      box-shadow: 0 0 12px rgba(45, 212, 191, 0.8);
    }

    #missatge-benvinguda {
      font-size: 1.15rem;
      font-weight: 600;
      color: #ccfbf1;
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.18), rgba(6, 182, 212, 0.2));
      border: 1px solid rgba(45, 212, 191, 0.5);
      border-radius: 14px;
      padding: 1rem 1.25rem;
      margin-bottom: 1.6rem;
      box-shadow:
        0 8px 24px -6px rgba(13, 148, 136, 0.4),
        inset 0 0 15px rgba(45, 212, 191, 0.12);
    }

    .g_id_signin {
      width: fit-content;
      margin: 0 auto;
      border-radius: 8px;
      box-shadow: 0 0 28px rgba(45, 212, 191, 0.35);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .g_id_signin:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 34px rgba(34, 211, 238, 0.55);
    }

    #boto-sortir {
      width: 100%;
      padding: 0.9rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #022c22;
      background: linear-gradient(135deg, #34d399 0%, #2dd4bf 50%, #22d3ee 100%);
      border: 1px solid rgba(167, 243, 208, 0.7);
      border-radius: 14px;
      cursor: pointer;
      box-shadow:
        0 10px 25px -5px rgba(20, 184, 166, 0.55),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
    }

    #boto-sortir:hover {
      transform: translateY(-2px);
      filter: brightness(1.07);
      box-shadow:
        0 14px 30px -4px rgba(34, 211, 238, 0.7),
        inset 0 1px 0 rgba(255, 255, 255, 0.65);
    }

    #boto-sortir:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <main class="targeta">
    <h1>PT 2.5 - GOOGLE SIGN IN</h1>

    <h2 id="missatge-benvinguda" style="display:none;">Missatge de benvinguda</h2>

    <div id="g_id_onload"
         data-client_id="167378223681-fja42193semuokpunhk6u8tbapmc0kne.apps.googleusercontent.com"
         data-callback="onSignIn">
    </div>

    <div class="g_id_signin" data-type="standard"></div>

    <button id="boto-sortir" style="display:none;" onclick="signOut()">Desconnectar</button>
  </main>

  <script>
    function onSignIn(response) {
      var id_token = response.credential;
      console.log("ID Token: " + id_token);

      const dades = JSON.parse(decodeURIComponent(escape(atob(
        id_token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')))));

      document.getElementById('missatge-benvinguda').textContent = "Benvingut/da, " + dades.name;
      document.getElementById('missatge-benvinguda').style.display = 'block';
      document.getElementById('boto-sortir').style.display = 'block';
      document.querySelector('.g_id_signin').style.display = 'none';
    }

    function signOut() {
      document.getElementById('missatge-benvinguda').style.display = 'none';
      document.getElementById('boto-sortir').style.display = 'none';
      document.querySelector('.g_id_signin').style.display = 'block';
    }
  </script>
</body>
</html>
